name: Notify downstream

# Asks the repos that pin aji-runtime to re-pin: a repository_dispatch (event_type
# upstream-release, client_payload {source: aji-runtime, tag}) to each, whose bump-pins.yml then
# opens a bump PR there. VideoJaNai, MangaJaNai GUI and mpv-AnimeJaNai pin the release assets
# (AjiRuntimeVersion + SHA-256s); MangaJaNaiCLI pins the tag's commit as a git dependency.
# release.yml calls this after a v* release; run it by hand to re-send a release.
#
# Needs the JANAI_BUMP_TOKEN secret: a fine-grained PAT with Contents write on the repos below.
# Without it this only warns, so a release never fails over it.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (blank = this repo's latest release)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1); blank = the latest release'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag (vX.Y.Z): $TAG"; exit 1; }
          # The apps' bump scripts download the release's assets, so it must be published.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q 'if .isDraft then error("draft") else "ok" end' \
            || { echo "::error::$TAG isn't a published release"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release: $TAG"
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.JANAI_BUMP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::JANAI_BUMP_TOKEN isn't set, so no bump PRs were requested for $TAG"
            exit 0
          fi
          for repo in the-database/VideoJaNai the-database/MangaJaNaiGUI the-database/mpv-AnimeJaNai the-database/MangaJaNaiCLI; do
            gh api "repos/$repo/dispatches" -f event_type=upstream-release \
              -f "client_payload[source]=aji-runtime" -f "client_payload[tag]=$TAG"
            echo "Asked $repo to re-pin aji-runtime $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          done
