name: release

# Builds aji-runtime for Windows and Linux and publishes them on a v* tag, which must equal
# Cargo.toml's version. Apps' installers pin a release by tag and SHA-256.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: aji-runtime-windows-x64.zip
          # The oldest supported runner: the binary runs on any glibc at least this new.
          - os: ubuntu-22.04
            asset: aji-runtime-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "dist/${{ matrix.asset }}" ./target/release/aji-runtime.exe LICENSE
          else
            tar -czf "dist/${{ matrix.asset }}" -C target/release aji-runtime -C "$GITHUB_WORKSPACE" LICENSE
          fi
          sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*
          gh release create "${GITHUB_REF_NAME}" dist/* -R "$GITHUB_REPOSITORY" --title "aji-runtime ${GITHUB_REF_NAME}" --notes "aji-runtime ${GITHUB_REF_NAME}"
